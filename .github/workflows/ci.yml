# CI/CD for open-retro.
#
#   PR into main   : lint -> test -> build
#   Pushes to main : lint -> test -> build -> deploy
#
# No DATABASE_URL secret here on purpose: migrations are applied by the app
# itself at startup (see src/server/bootstrap.ts), driven by the Web App's own
# AUTO_MIGRATE Application Setting — not by this pipeline. That keeps the
# production database credential out of GitHub entirely; only the deploy
# mechanics need secrets here.
#
# Secrets and variables live in Settings -> Secrets and variables -> Actions.
# GitHub separates the two and the distinction matters: a *secret* is encrypted,
# masked in logs and unreadable once saved; a *variable* is plain text anyone
# with read access can see.
#
#   Secrets                       Variables
#   -------                       ---------
#   AZURE_WEBAPP_PUBLISH_PROFILE  AZURE_APP_NAME
#
# AZURE_WEBAPP_PUBLISH_PROFILE is the whole XML file: Portal -> the Web App ->
# Get publish profile. Paste it in verbatim.
#
# Before the first push to main:
#
#  1. Kudu zip deploy needs basic auth, which Azure disables by default on newer
#     Web Apps. Portal -> the Web App -> Configuration -> General settings ->
#     "SCM Basic Auth Publishing Credentials": On.
#
#  2. Set AUTO_MIGRATE=true in the Web App's Application Settings so it applies
#     pending migrations on startup. The migrations here are hand-written —
#     some destructive — so review them before merging, since nothing in this
#     pipeline gates a bad one before it reaches production.
#
#  3. Set WEBSITE_RUN_FROM_PACKAGE=1 in the Web App's Application Settings.
#     Kudu's Zip Deploy does not clean the target directory before extracting
#     a new deployment (its logs even say so: "CleanOutputPath False"), so
#     without this a stale `.next` build or `node_modules` from a previous
#     deployment method can linger under /home/site/wwwroot and get served
#     instead of the new build — a real deploy that silently doesn't change
#     what users see. With this setting, Oryx still builds the app the same
#     way, but the *result* is packaged and mounted as one atomic, read-only
#     unit per deployment — nothing old survives to be merged with.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# One release at a time. Two overlapping main runs could otherwise deploy out
# of order and leave an older commit's build live.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    services:
      # Matches docker-compose.test.yml, so the suite runs against the same
      # Postgres major and credentials locally and in CI.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: retro
          POSTGRES_PASSWORD: retro
          POSTGRES_DB: agile_retro_test
        ports:
          - 5432:5432
        # Without this the job races the database's startup and the first
        # migration fails on connection refused.
        options: >-
          --health-cmd "pg_isready -U retro -d agile_retro_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # globalSetup runs `prisma migrate deploy` against this, so the run also
      # proves every committed migration still applies to an empty database —
      # the one thing local runs stop checking once a developer's test database
      # is already migrated.
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://retro:retro@localhost:5432/agile_retro_test

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # `next build` needs no secrets — verified by running it with every env
      # var unset.
      - run: npm run build

  deploy:
    runs-on: ubuntu-latest
    # A build that doesn't compile must never get as far as touching the Web
    # App. Migration happens after this, inside the app's own startup — see the
    # AUTO_MIGRATE note at the top of this file.
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4
      # Source, not a build: App Service runs Oryx, which does `npm install`
      # then `npm run build` on the server. That is also why tsx, dotenv and
      # cross-env are regular dependencies rather than devDependencies — the
      # startup command needs them at runtime.
      #
      # `.env` is git-ignored so it is never in a checkout; excluded anyway,
      # because one shipped by accident would silently override the App
      # Service's Application Settings with a developer's local DATABASE_URL.
      - name: Package source
        run: zip -r deploy.zip . -x '*.git*' 'node_modules/*' '.next/*' '.env' 'deploy.zip'
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_APP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: deploy.zip
