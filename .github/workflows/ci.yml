# CI/CD for open-retro.
#
#   PR into main   : lint -> test -> build
#   Pushes to main : lint -> test -> build -> deploy
#
# No DATABASE_URL secret here on purpose: migrations are applied by the app
# itself at startup (see src/server/bootstrap.ts), driven by the Web App's own
# AUTO_MIGRATE Application Setting — not by this pipeline. That keeps the
# production database credential out of GitHub entirely; only the deploy
# mechanics need secrets here.
#
# Secrets and variables live in Settings -> Secrets and variables -> Actions.
# GitHub separates the two and the distinction matters: a *secret* is encrypted,
# masked in logs and unreadable once saved; a *variable* is plain text anyone
# with read access can see.
#
#   Secrets                       Variables
#   -------                       ---------
#   AZURE_WEBAPP_PUBLISH_PROFILE  AZURE_APP_NAME
#
# AZURE_WEBAPP_PUBLISH_PROFILE is the whole XML file: Portal -> the Web App ->
# Get publish profile. Paste it in verbatim.
#
# Before the first push to main:
#
#  1. Kudu zip deploy needs basic auth, which Azure disables by default on newer
#     Web Apps. Portal -> the Web App -> Configuration -> General settings ->
#     "SCM Basic Auth Publishing Credentials": On.
#
#  2. Set AUTO_MIGRATE=true in the Web App's Application Settings so it applies
#     pending migrations on startup. The migrations here are hand-written —
#     some destructive — so review them before merging, since nothing in this
#     pipeline gates a bad one before it reaches production.
#
#  3. Leave SCM_DO_BUILD_DURING_DEPLOYMENT unset (or false) — this pipeline
#     builds in GitHub Actions and ships the finished app, not source. Oryx
#     has nothing to build, and its build sandbox has been unreliable for this
#     app (observed hangs of 15+ minutes mid `npm install`, and separately,
#     "successful" 4-second builds that had silently never run at all — Zip
#     Deploy only builds server-side when this setting is explicitly true,
#     which was never set, so every deploy for a while was just extracting
#     source on top of whatever `.next` happened to already be there).
#
#  4. Set WEBSITE_RUN_FROM_PACKAGE=1. Without it, Kudu re-compresses and
#     re-extracts the entire `node_modules` on every deploy *and every
#     container start* — 20-25s of CPU each time, which on a constrained plan
#     (e.g. Free F1's 60 CPU-minutes/day) a handful of restarts can exhaust
#     outright, and which was also observed corrupting `.bin/` shim symlinks
#     in the process (see the `node --import tsx` note in server.ts's start
#     script). WEBSITE_RUN_FROM_PACKAGE mounts the deployed zip directly
#     instead — instant startup, nothing to corrupt.
#
#     This was set to *not* use WEBSITE_RUN_FROM_PACKAGE earlier today, when
#     Oryx still needed to build server-side (that combination genuinely does
#     break — run-from-package's mount is read-only, and a server-side build
#     needs to write). Now that this pipeline builds in GitHub Actions and
#     ships a finished app, that conflict no longer applies. The one runtime
#     write this app had — next/image's optimizer cache — is turned off via
#     `images.unoptimized` in next.config.ts specifically so this mount can be
#     read-only. If anything else ever needs to write to disk at runtime,
#     WEBSITE_RUN_FROM_PACKAGE is the setting to revisit.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# One release at a time. Two overlapping main runs could otherwise deploy out
# of order and leave an older commit's build live.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    services:
      # Matches docker-compose.test.yml, so the suite runs against the same
      # Postgres major and credentials locally and in CI.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: retro
          POSTGRES_PASSWORD: retro
          POSTGRES_DB: agile_retro_test
        ports:
          - 5432:5432
        # Without this the job races the database's startup and the first
        # migration fails on connection refused.
        options: >-
          --health-cmd "pg_isready -U retro -d agile_retro_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # globalSetup runs `prisma migrate deploy` against this, so the run also
      # proves every committed migration still applies to an empty database —
      # the one thing local runs stop checking once a developer's test database
      # is already migrated.
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://retro:retro@localhost:5432/agile_retro_test

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # `next build` needs no secrets — verified by running it with every env
      # var unset.
      - run: npm run build
      # Everything past here only runs for an actual deploy (push to main), so
      # a PR build doesn't spend time packaging an artifact nobody will use.
      #
      # Pruned rather than shipped whole: `typescript`, `eslint`, `tailwindcss`
      # and `vitest` did their job producing `.next` above and are never
      # touched again. `prisma`, `next`, `tsx` and `dotenv` stay — they're
      # regular `dependencies` because the startup command needs them at
      # runtime.
      - name: Prune devDependencies for deployment
        if: github.ref == 'refs/heads/main'
        run: npm prune --omit=dev
      # The whole built app, not just source: this ships to Azure as-is and
      # runs as-is. Oryx builds nothing (see the SCM_DO_BUILD_DURING_DEPLOYMENT
      # note at the top of this file) — its build sandbox was unreliable for
      # this app, so building here, where it's already proven fast and
      # deterministic, and shipping the result removes that dependency
      # entirely.
      #
      # `.env` is git-ignored so it is never in a checkout; excluded anyway,
      # because one shipped by accident would silently override the App
      # Service's Application Settings with a developer's local DATABASE_URL.
      #
      # `.next/cache/*` is pure build-time cache (webpack/Turbopack incremental
      # state) — Next.js's own docs say not to deploy it, and shipping it here
      # was needlessly bloating every deployment against an already-tight disk
      # quota. `.windsurf`/`.claude`/`.agents` are local AI-tool config, not
      # app files; they were only ever in the zip by omission.
      - name: Package built app for deployment
        if: github.ref == 'refs/heads/main'
        run: >
          zip -r deploy.zip . -x '*.git*' '.env' 'deploy.zip'
          '.next/cache/*' '.windsurf/*' '.claude/*' '.agents/*'
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: deploy-package
          path: deploy.zip
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: deploy-package
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_APP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: deploy.zip
